<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Баня</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>
  <div class="app" id="app" data-link="broker">
    <header class="top">
      <span class="link" id="link"><span class="dot"></span><span id="link-text">подключение…</span></span>
      <span class="clock" id="clock"></span>
      <span class="spacer"></span>
      <button class="alarm-badge" id="alarm-badge" hidden>
        <img src="img/icons/danger.png" alt=""><span id="alarm-text"></span>
      </button>
      <button class="offoff ctl" id="offoff" title="Нагрев, свет, фен, запарник и обливное">
        <img src="img/icons/offoff.png" alt=""><span>Выключить всё</span>
      </button>
    </header>

    <nav class="nav" id="nav">
      <a href="#heat" data-view="heat"><img class="app-icon photo" src="img/modes/russian_bath.jpg" alt=""><span>Нагрев</span></a>
      <a href="#climate" data-view="climate"><img class="app-icon" src="img/icons/vent.png" alt=""><span>Климат</span></a>
      <a href="#light" data-view="light"><img class="app-icon" src="img/icons/bulb.png" alt=""><span>Свет</span></a>
      <a href="#water" data-view="water"><img class="app-icon" src="img/icons/waterfall_dark.png" alt=""><span>Обливное</span></a>
      <a href="#journal" data-view="journal"><img class="app-icon" src="img/icons/danger.png" alt=""><span>Журнал</span></a>
    </nav>

    <main class="main">
      <div class="card muted" id="waiting">Ждём данные от контроллера. Если это затянулось, проверьте индикатор связи в левом верхнем углу.</div>
      <section class="view" id="view-heat" data-view="heat"></section>
      <section class="view" id="view-climate" data-view="climate"></section>
      <section class="view" id="view-light" data-view="light"></section>
      <section class="view" id="view-water" data-view="water"></section>
      <section class="view" id="view-journal" data-view="journal"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="dialog-backdrop" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-text">
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn" id="dialog-cancel">Отмена</button>
        <button class="btn danger" id="dialog-ok">Выключить</button>
      </div>
    </div>
  </div>

  <script src="vendor/mqtt.min.js"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/ui.js?v=7"></script>
  <script src="js/transport.js?v=7"></script>
  <script src="js/demo.js?v=7"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/views/heating.js?v=7"></script>
  <script src="js/views/climate.js?v=7"></script>
  <script src="js/views/light.js?v=7"></script>
  <script src="js/views/waterfall.js?v=7"></script>
  <script src="js/views/journal.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
